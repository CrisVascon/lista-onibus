<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lista dos Ônibus</title>

<style>

body{
    font-family: Arial, sans-serif;

    background:
    linear-gradient(
    rgba(255,255,255,0.90),
    rgba(255,255,255,0.90)
    ),
    url('https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg');

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    margin:0;
    padding:20px;
    color:#111;
}

header{
    background:linear-gradient(90deg,#0b1f44,#133b7a);
    color:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

header h1{
    margin:0;
    font-size:40px;
    text-align:center;
    letter-spacing:2px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    border-top:5px solid #d4af37;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.mini{
    background:#f1f1f1;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.numero{
    font-size:40px;
    font-weight:bold;
    margin-top:10px;
}

input,
select,
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
    font-size:16px;
}

button{
    border:none;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    transform:scale(1.02);
}

.btn-add{
    background:#2ecc71;
    color:white;
}

.btn-remove{
    background:#e74c3c;
    color:white;
}

.btn-copy{
    background:#3498db;
    color:white;
}

pre{
    background:#111;
    color:#00ff66;
    padding:15px;
    border-radius:15px;
    overflow:auto;
    white-space:pre-wrap;
}

#contador{
    font-size:35px;
    text-align:center;
    font-weight:bold;
    color:#0b1f44;
}

.loading{
    position:fixed;
    inset:0;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    font-weight:bold;
    z-index:9999;
}

</style>

</head>

<body>

<div class="loading" id="loading">
Carregando...
</div>

<header>

<h1>Lista dos Ônibus</h1>

</header>

<div class="card">

<label>Escolha o ônibus</label>

<select id="onibus">

<option value="Executivo 1">
Executivo 1
</option>

<option value="Executivo Uninta">
Executivo Uninta
</option>

</select>

<label>Nome</label>

<input
type="text"
id="nome"
placeholder="Digite seu nome"
>

<label>Instituição / Parada</label>

<input
type="text"
id="instituicao"
placeholder="Digite sua instituição"
>

<button
class="btn-add"
onclick="adicionarNome()"
>
➕ Entrar na Lista
</button>

<button
class="btn-remove"
onclick="removerNome()"
>
➖ Tirar Meu Nome
</button>

<button
class="btn-copy"
onclick="copiarLista()"
>
📋 Copiar Lista
</button>

</div>

<div class="card">

<h2>⏰ Relógio</h2>

<div id="contador"></div>

</div>

<div class="grid">

<div class="mini">

Executivo 1

<div
class="numero"
id="totalExec1"
>
0
</div>

</div>

<div class="mini">

Executivo Uninta

<div
class="numero"
id="totalExec2"
>
0
</div>

</div>

<div class="mini">

Lista Extra

<div
class="numero"
id="totalExtra"
>
0
</div>

</div>

<div class="mini">

Total Geral

<div
class="numero"
id="totalGeral"
>
0
</div>

</div>

</div>

<div class="card">

<h2>🚌 Lista Atual</h2>

<pre id="lista"></pre>

</div>

<div class="card">

<h2>🏫 Quantidade por Instituição</h2>

<pre id="totaisInstituicao"></pre>

</div>

<audio id="somEntrada" preload="auto">

<source
src="fortnite-knocked.mp3"
type="audio/mpeg"
>

</audio>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "SUA_API_KEY",

authDomain: "lista-onibus.firebaseapp.com",

projectId: "lista-onibus",

storageBucket: "lista-onibus.firebasestorage.app",

messagingSenderId: "140892082129",

appId: "1:140892082129:web:b1ab4052d750e03345daf0"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let lista = [];

function atualizarRelogio(){

const agora = new Date();

const horas =
String(agora.getHours()).padStart(2,'0');

const minutos =
String(agora.getMinutes()).padStart(2,'0');

const segundos =
String(agora.getSeconds()).padStart(2,'0');

document.getElementById('contador')
.innerHTML =
horas + ':' + minutos + ':' + segundos;

}

setInterval(atualizarRelogio,1000);

window.adicionarNome = async function(){

const nome =
document.getElementById('nome')
.value
.trim();

const instituicao =
document.getElementById('instituicao')
.value
.trim();

const onibus =
document.getElementById('onibus')
.value;

if(!nome || !instituicao){

alert('Preencha todos os campos');

return;

}

document
.getElementById('somEntrada')
.play();

const jaExiste =
lista.find(item =>
item.nome.toLowerCase() ===
nome.toLowerCase()
);

if(jaExiste){

alert('Esse nome já está na lista');

return;

}

let listaDestino = onibus;

const totalMesmo =
lista.filter(item =>
item.onibus === onibus
).length;

if(totalMesmo >= 46){

listaDestino = 'Lista Extra';

}

await addDoc(
collection(db,'listaExecutivos'),
{

nome,
instituicao,
onibus: listaDestino,
timestamp: Date.now()

}
);

document.getElementById('nome').value = '';
document.getElementById('instituicao').value = '';

}

window.removerNome = async function(){

const nome =
document.getElementById('nome')
.value
.trim();

if(!nome){

alert('Digite seu nome');

return;

}

const pessoa =
lista.find(item =>
item.nome.toLowerCase() ===
nome.toLowerCase()
);

if(!pessoa){

alert('Nome não encontrado');

return;

}

await deleteDoc(
doc(
db,
'listaExecutivos',
pessoa.id
)
);

alert('Nome removido');

}

window.copiarLista = async function(){

let texto = 'LISTA DOS ÔNIBUS\n\n';

['Executivo 1','Executivo Uninta','Lista Extra']
.forEach(onibus=>{

texto += onibus.toUpperCase() + '\n\n';

const pessoas =
lista.filter(item =>
item.onibus === onibus
);

if(pessoas.length === 0){

texto += '- vazio\n\n';

}else{

pessoas.forEach((item,index)=>{

texto +=
(index+1)+'. '+
item.nome+' | '+
item.instituicao+'\n';

});

texto += '\n';

}

});

try{

await navigator.clipboard.writeText(texto);

alert('Lista copiada');

}catch{

const area =
document.createElement('textarea');

area.value = texto;

document.body.appendChild(area);

area.select();

document.execCommand('copy');

document.body.removeChild(area);

alert('Lista copiada');

}

}

onSnapshot(
collection(db,'listaExecutivos'),
(snapshot)=>{

lista = [];

snapshot.forEach((docItem)=>{

lista.push({

id: docItem.id,
...docItem.data()

});

});

atualizarTela();

}
);

function atualizarTela(){

lista.sort((a,b)=>{

if(a.timestamp === b.timestamp){

return a.nome.localeCompare(b.nome);

}

return a.timestamp - b.timestamp;

});

let texto = '';

[
'Executivo 1',
'Executivo Uninta',
'Lista Extra'
]
.forEach(onibus=>{

texto +=
onibus.toUpperCase() +
'\n\n';

const pessoas =
lista.filter(item =>
item.onibus === onibus
);

if(pessoas.length === 0){

texto += '- vazio\n\n';

}else{

pessoas.forEach((pessoa,index)=>{

texto +=
(index+1)+'. '+
pessoa.nome+' | '+
pessoa.instituicao+'\n';

});

}

texto +=
'\n-------------------\n\n';

});

document
.getElementById('lista')
.textContent = texto;

const total1 =
lista.filter(item =>
item.onibus ===
'Executivo 1'
).length;

const total2 =
lista.filter(item =>
item.onibus ===
'Executivo Uninta'
).length;

const totalExtra =
lista.filter(item =>
item.onibus ===
'Lista Extra'
).length;

document
.getElementById('totalExec1')
.innerHTML = total1;

document
.getElementById('totalExec2')
.innerHTML = total2;

document
.getElementById('totalExtra')
.innerHTML = totalExtra;

document
.getElementById('totalGeral')
.innerHTML = lista.length;

let universidades = {};

lista.forEach(item=>{

const chave =
item.instituicao.toUpperCase();

universidades[chave] =
(universidades[chave] || 0) + 1;

});

let textoUniversidades = '';

Object.entries(universidades)

.sort((a,b)=>b[1]-a[1])

.forEach(([nome,total])=>{

textoUniversidades +=
nome +
': ' +
total +
' pessoa(s)\n';

});

document
.getElementById('totaisInstituicao')
.textContent =
textoUniversidades ||
'Sem dados';

}

setTimeout(()=>{

document
.getElementById('loading')
.style.display='none';

},1500);

</script>

</body>
</html>
